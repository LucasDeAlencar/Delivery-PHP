<!DOCTYPE html>
<html>
<head>
    <title>Teste - Popup Preço Mínimo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>🛒 Teste - Popup Preço Mínimo</h1>
        
        <div class="section">
            <h3>1. Configurar Preço Mínimo nos Dados Corporativos</h3>
            <input type="number" id="preco-config" placeholder="Ex: 25.00" step="0.01">
            <button onclick="configurarPrecoMinimo()">Configurar</button>
            <div id="resultado-config"></div>
        </div>
        
        <div class="section">
            <h3>2. Simular Carrinho com Valor Insuficiente</h3>
            <p>Total do carrinho: R$ <input type="number" id="total-carrinho" placeholder="Ex: 15.00" step="0.01" value="15.00"></p>
            <button onclick="simularCarrinho()">Simular Finalização</button>
            <p><small>Isso deve mostrar o popup de valor mínimo se o valor for menor que o configurado.</small></p>
        </div>
        
        <div class="section">
            <h3>3. Verificar Preço Mínimo Atual</h3>
            <button onclick="verificarPrecoMinimo()">Verificar</button>
            <div id="resultado-verificar"></div>
        </div>
    </div>

    <script>
        // Função do modal (copiada do carrinho-simples.js)
        function mostrarModal(titulo, mensagem, tipo = 'info') {
            const cores = {
                success: '#28a745',
                error: '#dc3545', 
                warning: '#ffc107',
                info: '#17a2b8'
            };

            const icones = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle', 
                info: 'fa-info-circle'
            };

            const html = `
                <div id="modal-custom" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: flex; align-items: center; justify-content: center;">
                    <div style="background: #1a1a1a; width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; color: white; text-align: center; border-top: 4px solid ${cores[tipo]};">
                        <div style="margin-bottom: 15px;">
                            <i class="fas ${icones[tipo]}" style="font-size: 3rem; color: ${cores[tipo]};"></i>
                        </div>
                        <h4 style="color: ${cores[tipo]}; margin-bottom: 15px;">${titulo}</h4>
                        <p style="margin-bottom: 20px; line-height: 1.5;">${mensagem.replace(/\n/g, '<br>')}</p>
                        <button onclick="$('#modal-custom').remove()" style="background: ${cores[tipo]}; color: ${tipo === 'warning' ? '#000' : '#fff'}; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                            OK
                        </button>
                    </div>
                </div>
            `;

            $('body').append(html);
        }

        async function configurarPrecoMinimo() {
            const preco = document.getElementById('preco-config').value;
            const resultado = document.getElementById('resultado-config');
            
            try {
                const response = await fetch('/admin/dados-corporativos/atualizar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        endereco: '',
                        cep: '',
                        numero: '',
                        whatsapp: '',
                        email: '',
                        instagram: '',
                        facebook: '',
                        preco_minimo_compra: preco
                    })
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    resultado.innerHTML = `<p class="success">✅ Preço mínimo configurado: R$ ${preco}</p>`;
                } else {
                    resultado.innerHTML = `<p class="error">❌ Erro: ${data.msg}</p>`;
                }
            } catch (error) {
                resultado.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }
        }
        
        async function simularCarrinho() {
            const totalCarrinho = parseFloat(document.getElementById('total-carrinho').value) || 0;
            
            try {
                const response = await fetch('/api/configuracao/preco-minimo');
                const data = await response.json();
                
                if (data.success && data.preco_minimo > 0) {
                    if (totalCarrinho < data.preco_minimo) {
                        const valorFaltante = data.preco_minimo - totalCarrinho;
                        mostrarModal(
                            'Valor Mínimo', 
                            `Valor mínimo para pedido é R$ ${data.preco_minimo.toFixed(2).replace('.', ',')}.<br>` +
                            `Adicione mais R$ ${valorFaltante.toFixed(2).replace('.', ',')} em produtos.`, 
                            'warning'
                        );
                    } else {
                        mostrarModal('Sucesso!', 'Valor suficiente para finalizar pedido!', 'success');
                    }
                } else {
                    mostrarModal('Info', 'Nenhum preço mínimo configurado.', 'info');
                }
            } catch (error) {
                mostrarModal('Erro', 'Erro ao verificar preço mínimo: ' + error.message, 'error');
            }
        }
        
        async function verificarPrecoMinimo() {
            const resultado = document.getElementById('resultado-verificar');
            
            try {
                const response = await fetch('/api/configuracao/preco-minimo');
                const data = await response.json();
                
                if (data.success) {
                    resultado.innerHTML = `<p class="success">✅ Preço mínimo atual: R$ ${data.preco_minimo.toFixed(2).replace('.', ',')}</p>`;
                } else {
                    resultado.innerHTML = `<p class="error">❌ Erro ao carregar preço mínimo</p>`;
                }
            } catch (error) {
                resultado.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
