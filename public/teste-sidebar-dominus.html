<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Sidebar Dominus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="assets/css/carrinho-dominus.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        
        .test-header {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .test-menu {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .test-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }
        
        .test-menu li {
            position: relative;
        }
        
        .test-menu a {
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .test-menu a:hover {
            background: #444;
        }
        
        .btn-test {
            background: #f8b531;
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        
        .btn-test:hover {
            background: #fac56e;
        }
        
        .log-area {
            background: #000;
            color: #0f0;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="test-header">
        <h1>🧪 Teste da Sidebar Dominus</h1>
        <p>Teste isolado do sistema de carrinho estilo Domino's</p>
    </div>

    <!-- Menu de Teste -->
    <div class="test-menu">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li id="carrinho-badge-container">
                <a href="#">
                    <i class="fas fa-shopping-cart"></i> Carrinho
                    <span id="carrinho-badge" style="display: none;">0</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Botões de Teste -->
    <div>
        <h2>Ações de Teste:</h2>
        
        <button class="btn-test" onclick="testarAdicionar()">
            ➕ Adicionar Produto
        </button>
        
        <button class="btn-test" onclick="testarAbrirSidebar()">
            📂 Abrir Sidebar
        </button>
        
        <button class="btn-test" onclick="testarFecharSidebar()">
            📁 Fechar Sidebar
        </button>
        
        <button class="btn-test" onclick="testarLimpar()">
            🗑️ Limpar Carrinho
        </button>
        
        <button class="btn-test" onclick="verificarEstado()">
            🔍 Verificar Estado
        </button>
    </div>

    <!-- Área de Logs -->
    <div class="log-area" id="log-area">
        Logs aparecerão aqui...<br>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="assets/js/carrinho-dominus.js"></script>

    <script>
        // Interceptar console.log
        const logArea = document.getElementById('log-area');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        function addLog(message, type = 'log') {
            const color = type === 'error' ? '#f00' : type === 'warn' ? '#ff0' : '#0f0';
            logArea.innerHTML += `<span style="color: ${color}">[${new Date().toLocaleTimeString()}] ${message}</span><br>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'log');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addLog('❌ ' + args.join(' '), 'error');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLog('⚠️ ' + args.join(' '), 'warn');
        };

        // Funções de teste
        function testarAdicionar() {
            console.log('🧪 TESTE: Adicionando produto...');
            
            if (window.Carrinho) {
                Carrinho.adicionar({
                    id: Math.floor(Math.random() * 1000),
                    nome: 'Pizza Teste ' + Math.floor(Math.random() * 100),
                    preco: 35.90,
                    quantidade: 1,
                    observacoes: 'Teste',
                    imagem: ''
                });
                console.log('✅ Produto adicionado!');
            } else {
                console.error('❌ Carrinho não encontrado!');
            }
        }

        function testarAbrirSidebar() {
            console.log('🧪 TESTE: Abrindo sidebar...');
            
            if (window.Carrinho) {
                Carrinho.abrirSidebar();
            } else {
                console.error('❌ Carrinho não encontrado!');
            }
        }

        function testarFecharSidebar() {
            console.log('🧪 TESTE: Fechando sidebar...');
            
            if (window.Carrinho) {
                Carrinho.fecharSidebar();
            } else {
                console.error('❌ Carrinho não encontrado!');
            }
        }

        function testarLimpar() {
            console.log('🧪 TESTE: Limpando carrinho...');
            
            if (window.Carrinho) {
                Carrinho.limpar();
            } else {
                console.error('❌ Carrinho não encontrado!');
            }
        }

        function verificarEstado() {
            console.log('🧪 TESTE: Verificando estado...');
            console.log('='.repeat(50));
            
            if (window.Carrinho) {
                console.log('✅ Carrinho existe');
                console.log('📦 Itens:', Carrinho.itens.length);
                console.log('📊 Total itens:', Carrinho.getTotalItens());
                console.log('💰 Valor total:', Carrinho.getValorTotal());
                
                const sidebar = document.getElementById('carrinho-sidebar');
                const overlay = document.getElementById('carrinho-overlay');
                const badge = document.getElementById('carrinho-badge');
                
                console.log('🏗️ Sidebar existe:', !!sidebar);
                console.log('🏗️ Overlay existe:', !!overlay);
                console.log('🏗️ Badge existe:', !!badge);
                
                if (sidebar) {
                    console.log('📍 Sidebar classes:', sidebar.className);
                }
                
                if (badge) {
                    console.log('📍 Badge display:', badge.style.display);
                    console.log('📍 Badge text:', badge.textContent);
                }
            } else {
                console.error('❌ Carrinho NÃO existe!');
            }
            
            console.log('='.repeat(50));
        }

        // Verificar ao carregar
        window.addEventListener('load', function() {
            console.log('🌐 Página carregada!');
            setTimeout(verificarEstado, 1000);
        });
    </script>
</body>
</html>
